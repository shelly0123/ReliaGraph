# Optional local Neo4j service. Start with: docker compose -f docker-compose.stores.yml up -d
# Configure RELIAGRAPH_NEO4J_URI=bolt://127.0.0.1:7687, USER=neo4j, PASSWORD=<your password>
services:
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/ReliaGraphChangeThisPassword
    volumes:
      - reliagraph_neo4j_data:/data
volumes:
  reliagraph_neo4j_data:
